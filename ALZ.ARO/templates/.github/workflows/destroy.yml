name: 03 ARO Landing Zone Manual Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE to authorize destruction
        required: true
        type: string
      expected_sha:
        description: Full SHA at the selected default branch ref
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aro-terraform-apply
  cancel-in-progress: false

jobs:
  destroy:
    environment: apply
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform } }
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      DESTROY_CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      TF_VAR_pull_secret: ${{ secrets.REDHAT_PULL_SECRET }}
      TF_VAR_application_gateway_ssl_certificate_data: ${{ secrets.APPLICATION_GATEWAY_SSL_CERTIFICATE_DATA }}
      TF_VAR_application_gateway_ssl_certificate_password: ${{ secrets.APPLICATION_GATEWAY_SSL_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.expected_sha }}' }
      - name: Verify confirmation, branch, and SHA
        shell: bash
        working-directory: .
        run: |
          test "$DESTROY_CONFIRMATION" = 'DELETE'
          test "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.9.8' }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: terraform init -input=false
      - run: terraform plan -destroy -input=false -lock-timeout=5m -out=destroy.tfplan
      - name: Destroy with exact plan
        run: terraform apply -input=false -lock-timeout=5m destroy.tfplan
