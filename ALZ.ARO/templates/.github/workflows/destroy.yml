name: Terraform manual destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE to authorize destruction
        required: true
        type: string
      expected_sha:
        description: Full SHA at the selected default branch ref
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  destroy:
    environment: apply
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform } }
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_aro_service_principal_client_id: ${{ secrets.ARO_SERVICE_PRINCIPAL_CLIENT_ID }}
      TF_VAR_aro_service_principal_client_secret: ${{ secrets.ARO_SERVICE_PRINCIPAL_CLIENT_SECRET }}
      TF_VAR_aro_service_principal_object_id: ${{ secrets.ARO_SERVICE_PRINCIPAL_OBJECT_ID }}
      TF_VAR_aro_resource_provider_object_id: ${{ secrets.ARO_RESOURCE_PROVIDER_OBJECT_ID }}
      TF_VAR_pull_secret: ${{ secrets.REDHAT_PULL_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.expected_sha }}' }
      - name: Verify confirmation, branch, and SHA
        shell: bash
        working-directory: .
        run: |
          test "${{ inputs.confirmation }}" = 'DELETE'
          test "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}"
          [[ "${{ inputs.expected_sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.9.8' }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: terraform init -input=false
      - run: terraform plan -destroy -input=false -lock-timeout=5m -out=destroy.tfplan
      - name: Destroy with exact plan
        run: terraform apply -input=false -lock-timeout=5m destroy.tfplan
