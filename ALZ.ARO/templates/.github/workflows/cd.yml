name: 02 ARO Landing Zone Continuous Delivery

on:
  workflow_dispatch:
    inputs:
      ref_sha:
        description: Full commit SHA to plan and apply
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aro-terraform-apply
  cancel-in-progress: false

jobs:
  CD:
    uses: ./.github/workflows/cd-template.yml
    with:
      ref_sha: ${{ inputs.ref_sha }}
      plan_environment: plan
      apply_environment: apply
      runner_label: ubuntu-latest
      working_directory: terraform
    secrets: inherit
