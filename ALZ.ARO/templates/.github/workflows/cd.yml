name: 02 ARO Landing Zone Continuous Delivery

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action: 'apply' to deploy, 'destroy' to teardown"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: aro-terraform-apply
  cancel-in-progress: false

jobs:
  CD:
    uses: ./.github/workflows/cd-template.yml
    with:
      plan_environment: plan
      apply_environment: apply
      action: ${{ inputs.action }}
      runner_label: ubuntu-latest
      working_directory: terraform
    secrets: inherit
