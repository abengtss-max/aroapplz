site_name: ARO Application Landing Zone Accelerator
site_description: Plan-first landing zone automation for private Azure Red Hat OpenShift
site_url: https://abengtss-max.github.io/aroapplz/
repo_url: https://github.com/abengtss-max/aroapplz
repo_name: abengtss-max/aroapplz
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 aroapplz contributors

exclude_docs: |
  /architecture.md
  /quickstart.md
  /configuration.md
  /identity.md
  /day2.md
  /validation.md
  /alz-corp-policy.md

nav:
  - Home: index.md
  - Get started:
      - Overview: get-started/index.md
      - Prerequisites: get-started/prerequisites.md
      - Choose a mode: get-started/choose-mode.md
      - Quickstart: get-started/quickstart.md
  - Concepts:
      - How it works: concepts/how-it-works.md
      - Networking: concepts/networking.md
  - Reference:
      - Configuration: reference/configuration.md
      - Identity and authorization: reference/identity.md
  - Operations:
      - Day-2 operations: operations/day2.md
      - Validation: operations/validation.md
      - Remove workload and bootstrap: operations/cleanup.md
  - Governance:
      - ALZ corporate policy: governance/alz-corp-policy.md
  - Known issues: known-issues.md
  - FAQ: faq.md
  - Contributing: contributing.md

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/abengtss-max/aroapplz
      name: aroapplz on GitHub
